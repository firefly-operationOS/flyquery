openapi: 3.1.0
info:
  contact:
    name: Firefly OperationOS
    url: https://github.com/firefly-operationOS/flyquery
  license:
    name: Proprietary -- service
    url: https://github.com/firefly-operationOS/flyquery/blob/main/LICENSE
  title: flyquery
  version: 26.5.4
servers:
- description: This service
  url: /
tags:
- description: Agent-tier few-shot example management (requires X-Agent-Token).
  name: agent-examples
- description: Agent-tier Text-to-SQL pipeline (requires X-Agent-Token with query
    scope).
  name: agent-query
- description: Agent-tier direct SQL execution (requires X-Agent-Token with sql:execute
    scope).
  name: agent-sql
- description: "Lifecycle management for machine-to-machine agent tokens (create,\
    \ list, revoke)."
  name: agent-tokens
- description: Multi-turn conversation sessions backed by the schema KB.
  name: conversations
- description: "Dataset lifecycle (create, fetch, delete). A dataset groups one or\
    \ more uploaded files into a named schema boundary."
  name: datasets
- description: Few-shot Text-to-SQL examples stored in the workspace vector index.
  name: examples
- description: "File upload + re-upload. POST a structured file (CSV, TSV, XLSX, XLS,\
    \ ODS, JSON, JSONL, Parquet, Avro, ORC, Arrow, Feather) to kick off the 10-stage\
    \ ingestion pipeline. Re-upload triggers schema-drift detection and annotation\
    \ transplant."
  name: files
- description: Business glossary terms linked to schema columns and datasets.
  name: glossary
- description: Ingestion job tracking and SSE event streaming.
  name: ingest
- description: "Text-to-SQL query pipeline. Converts natural-language questions to\
    \ validated SQL, executes against DuckDB, and returns structured results."
  name: query
- description: Cross-table join proposals. Heuristic + AI-proposed foreign-key candidates
    with human approve/reject workflow.
  name: relations
- description: "Schema knowledge-base objects and change proposals. Column-level AI\
    \ descriptions, domain metadata, and the diff stream from re-uploads."
  name: schema
- description: Semantic layer -- MetricFlow-compatible metrics and dimensions derived
    from the ingested schema KB.
  name: semantic
- description: Direct SQL execution surface (scoped by workspace RLS).
  name: sql
- description: "Materialised table catalogue. Read table snapshots, column profiles,\
    \ and schema change history produced by the ingestion pipeline."
  name: tables
- description: "Service identity. Returns deployed CalVer, service name. The agent-tier\
    \ variant requires a valid X-Agent-Token."
  name: meta
- description: "Multi-tenant workspace management. Each workspace scopes datasets,\
    \ schema KB, relations, and agent tokens."
  name: workspaces
paths:
  /api/v1/agent-tokens:
    get:
      description: |-
        Returns the summary shape only -- the secret is never
        round-tripped on this endpoint.
      operationId: list_tokens
      parameters:
      - $ref: "#/components/parameters/TenantIdHeader"
      - $ref: "#/components/parameters/WorkspaceIdHeader"
      - $ref: "#/components/parameters/CorrelationIdHeader"
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/AgentTokenSummaryDto"
                type: array
          description: Successful response
      security:
      - TenantContext: []
        WorkspaceContext: []
      summary: List tokens for the current tenant (newest first).
      tags:
      - agent-tokens
      x-accepts:
      - application/json
    post:
      description: |-
        Returns 201 with the full ``token`` populated. The token is
        only returned this once -- subsequent reads expose only
        ``prefix``. Refuses agent-tier callers with
        ``403 agent_cannot_mint``.
      operationId: mint
      parameters:
      - $ref: "#/components/parameters/TenantIdHeader"
      - $ref: "#/components/parameters/WorkspaceIdHeader"
      - $ref: "#/components/parameters/CorrelationIdHeader"
      - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentTokenMintRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentTokenCreated"
          description: Successful response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - TenantContext: []
        WorkspaceContext: []
      summary: Mint a new agent token.
      tags:
      - agent-tokens
      x-content-type: application/json
      x-accepts:
      - application/json
  /api/v1/agent-tokens/{token_id}:
    delete:
      description: Unknown ``token_id`` returns ``404 resource_not_found``.
      operationId: revoke
      parameters:
      - explode: false
        in: path
        name: token_id
        required: true
        schema:
          nullable: true
          type: string
        style: simple
      - $ref: "#/components/parameters/TenantIdHeader"
      - $ref: "#/components/parameters/WorkspaceIdHeader"
      - $ref: "#/components/parameters/CorrelationIdHeader"
      - $ref: "#/components/parameters/IdempotencyKeyHeader"
      responses:
        "204":
          description: No Content
      security:
      - TenantContext: []
        WorkspaceContext: []
      summary: Revoke a token. Idempotent -- already-revoked is a no-op (204).
      tags:
      - agent-tokens
      x-accepts:
      - application/json
  /api/v1/agent/examples:
    get:
      description: |-
        :param http_request: Starlette request
        :param quality: optional quality filter (PROPOSED/APPROVED/REJECTED)
        :param dataset_id: optional dataset filter
        :return: ``{"items": [...]}``
      operationId: list_examples
      parameters:
      - explode: true
        in: query
        name: quality
        required: false
        schema:
          default: null
          type: string
        style: form
      - explode: true
        in: query
        name: dataset_id
        required: false
        schema:
          nullable: true
          type: string
        style: form
      - $ref: "#/components/parameters/AgentTokenHeader"
      - $ref: "#/components/parameters/CorrelationIdHeader"
      responses:
        "200":
          description: Successful response
      security:
      - AgentToken: []
      summary: List examples for the caller's workspace (agent-tier).
      tags:
      - agent-examples
      x-accepts:
      - application/json
    post:
      description: |-
        :param http_request: Starlette request
        :param body: validated ExampleCreate
        :return: ExampleRead with created fields
      operationId: create
      parameters:
      - $ref: "#/components/parameters/AgentTokenHeader"
      - $ref: "#/components/parameters/CorrelationIdHeader"
      - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExampleCreate"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExampleRead"
          description: Successful response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - AgentToken: []
      summary: "Create an example (agent-tier — source=AGENT_LEARNED, quality=PROPOSED)."
      tags:
      - agent-examples
      x-content-type: application/json
      x-accepts:
      - application/json
  /api/v1/agent/query:
    post:
      description: |-
        :param http_request: Starlette request (provides tenant context + agent token)
        :param body: validated QueryRequest
        :return: AnswerResponse
      operationId: query
      parameters:
      - $ref: "#/components/parameters/AgentTokenHeader"
      - $ref: "#/components/parameters/CorrelationIdHeader"
      - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueryRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnswerResponse"
          description: Successful response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - AgentToken: []
      summary: Run the full NL → SQL → result pipeline (agent-tier).
      tags:
      - agent-query
      x-content-type: application/json
      x-accepts:
      - application/json
  /api/v1/agent/query/stream:
    post:
      description: |-
        :param http_request: Starlette request
        :param body: validated QueryRequest
        :return: StreamingResponse with text/event-stream
      operationId: stream
      parameters:
      - $ref: "#/components/parameters/AgentTokenHeader"
      - $ref: "#/components/parameters/CorrelationIdHeader"
      - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueryRequest"
        required: true
      responses:
        "200":
          description: Successful response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - AgentToken: []
      summary: Run the pipeline as SSE stream (agent-tier).
      tags:
      - agent-query
      x-content-type: application/json
      x-accepts:
      - application/json
  /api/v1/agent/query:explain:
    post:
      description: |-
        :param http_request: Starlette request
        :param body: validated QueryRequest
        :return: ExplainResponse with candidate SQL and reasoning
      operationId: explain
      parameters:
      - $ref: "#/components/parameters/AgentTokenHeader"
      - $ref: "#/components/parameters/CorrelationIdHeader"
      - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueryRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExplainResponse"
          description: Successful response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - AgentToken: []
      summary: Run Grounding + Generation only (agent-tier).
      tags:
      - agent-query
      x-content-type: application/json
      x-accepts:
      - application/json
  /api/v1/agent/query:validate:
    post:
      description: |-
        :param http_request: Starlette request
        :param body: validated QueryRequest
        :return: ValidateResponse
      operationId: validate
      parameters:
      - $ref: "#/components/parameters/AgentTokenHeader"
      - $ref: "#/components/parameters/CorrelationIdHeader"
      - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueryRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidateResponse"
          description: Successful response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - AgentToken: []
      summary: Run Grounding + Generation + AST + ScopeGuard (agent-tier).
      tags:
      - agent-query
      x-content-type: application/json
      x-accepts:
      - application/json
  /api/v1/agent/sql:execute:
    post:
      description: |-
        :param http_request: Starlette request
        :param body: validated SqlExecuteRequest
        :return: SqlExecuteResponse
      operationId: execute
      parameters:
      - $ref: "#/components/parameters/AgentTokenHeader"
      - $ref: "#/components/parameters/CorrelationIdHeader"
      - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SqlExecuteRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SqlExecuteResponse"
          description: Successful response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - AgentToken: []
      summary: Execute SQL directly (agent-tier).
      tags:
      - agent-sql
      x-content-type: application/json
      x-accepts:
      - application/json
  /api/v1/agent/sql:execute/stream:
    post:
      description: |-
        :param http_request: Starlette request
        :param body: validated SqlExecuteRequest
        :return: StreamingResponse with text/event-stream
      operationId: execute_stream
      parameters:
      - $ref: "#/components/parameters/AgentTokenHeader"
      - $ref: "#/components/parameters/CorrelationIdHeader"
      - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SqlExecuteRequest"
        required: true
      responses:
        "200":
          description: Successful response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - AgentToken: []
      summary: Execute SQL as SSE stream (agent-tier).
      tags:
      - agent-sql
      x-content-type: application/json
      x-accepts:
      - application/json
  /api/v1/agent/version:
    get:
      description: |-
        Requires a valid ``X-Agent-Token`` with ``flyquery.audit:read`` scope.
        Missing or invalid tokens return 401 / 403 respectively.
      operationId: version
      parameters:
      - $ref: "#/components/parameters/AgentTokenHeader"
      - $ref: "#/components/parameters/CorrelationIdHeader"
      responses:
        "200":
          description: Successful response
      security:
      - AgentToken: []
      summary: Return service name + CalVer version tag.
      tags:
      - meta
      x-accepts:
      - application/json
  /api/v1/conversations:
    get:
      description: |-
        :param http_request: Starlette request
        :return: ``{"items": [...]}``
      operationId: list_conversations
      parameters:
      - $ref: "#/components/parameters/TenantIdHeader"
      - $ref: "#/components/parameters/WorkspaceIdHeader"
      - $ref: "#/components/parameters/CorrelationIdHeader"
      responses:
        "200":
          description: Successful response
      security:
      - TenantContext: []
        WorkspaceContext: []
      summary: "List conversations for the caller's workspace, newest first."
      tags:
      - conversations
      x-accepts:
      - application/json
    post:
      description: |-
        :param http_request: Starlette request (tenant context headers)
        :param body: optional title
        :return: the new ConversationRead (no turns yet)
      operationId: create
      parameters:
      - $ref: "#/components/parameters/TenantIdHeader"
      - $ref: "#/components/parameters/WorkspaceIdHeader"
      - $ref: "#/components/parameters/CorrelationIdHeader"
      - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationCreate"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationRead"
          description: Successful response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - TenantContext: []
        WorkspaceContext: []
      summary: Create a new conversation.
      tags:
      - conversations
      x-content-type: application/json
      x-accepts:
      - application/json
  /api/v1/conversations/{conversation_id}:
    get:
      description: |-
        :param conversation_id: conversation UUID
        :return: ConversationRead including turns list
        :raises ResourceNotFound: when conversation does not exist
      operationId: read
      parameters:
      - explode: false
        in: path
        name: conversation_id
        required: true
        schema:
          nullable: true
          type: string
        style: simple
      - $ref: "#/components/parameters/TenantIdHeader"
      - $ref: "#/components/parameters/WorkspaceIdHeader"
      - $ref: "#/components/parameters/CorrelationIdHeader"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationRead"
          description: Successful response
      security:
      - TenantContext: []
        WorkspaceContext: []
      summary: Fetch a conversation with all its turns.
      tags:
      - conversations
      x-accepts:
      - application/json
  /api/v1/conversations/{conversation_id}/turn:
    post:
      description: |-
        Loads the prior turn's ``executed_sql + table_qnames + snapshot_pins``
        and passes them into the query pipeline as drill-down context.

        :param http_request: Starlette request
        :param conversation_id: conversation UUID
        :param body: dataset_id + question
        :return: AnswerResponse from the full pipeline
      operationId: post_turn
      parameters:
      - explode: false
        in: path
        name: conversation_id
        required: true
        schema:
          type: string
        style: simple
      - $ref: "#/components/parameters/TenantIdHeader"
      - $ref: "#/components/parameters/WorkspaceIdHeader"
      - $ref: "#/components/parameters/CorrelationIdHeader"
      - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationTurnRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnswerResponse"
          description: Successful response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - TenantContext: []
        WorkspaceContext: []
      summary: Ask a follow-up question inside an existing conversation.
      tags:
      - conversations
      x-content-type: application/json
      x-accepts:
      - application/json
  /api/v1/datasets:
    get:
      description: |-
        Query parameters
        ----------------
        * ``q``            -- free-text substring against ``name`` or
        ``description`` (case-insensitive ``ILIKE``).
        * ``name``         -- exact match -- gives you name-based lookup
        with zero extra round-trips.
        * ``status``       -- ``ACTIVE`` / ``ARCHIVED`` / ``PURGING``.
        * ``workspace_id`` -- restrict to a single workspace; defaults to
        ``X-Workspace-Id`` header. Pass another UUID
        explicitly to override the header.
        * ``limit``        -- page size, clamped to [1, 1000]. Default 100.
        * ``offset``       -- starting offset. Default 0.

        Response envelope: ``{items, total, limit, offset, has_more}``.
      operationId: list_datasets
      parameters:
      - explode: true
        in: query
        name: q
        required: false
        schema:
          nullable: true
          type: string
        style: form
      - explode: true
        in: query
        name: name
        required: false
        schema:
          nullable: true
          type: string
        style: form
      - explode: true
        in: query
        name: status
        required: false
        schema:
          nullable: true
          type: string
        style: form
      - explode: true
        in: query
        name: workspace_id
        required: false
        schema:
          nullable: true
          type: string
        style: form
      - explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 100
          type: integer
        style: form
      - explode: true
        in: query
        name: offset
        required: false
        schema:
          default: 0
          type: integer
        style: form
      - $ref: "#/components/parameters/TenantIdHeader"
      - $ref: "#/components/parameters/WorkspaceIdHeader"
      - $ref: "#/components/parameters/CorrelationIdHeader"
      responses:
        "200":
          description: Successful response
      security:
      - TenantContext: []
        WorkspaceContext: []
      summary: Search/filter datasets for the caller's tenant.
      tags:
      - datasets
      x-accepts:
      - application/json
    post:
      operationId: create
      parameters:
      - $ref: "#/components/parameters/TenantIdHeader"
      - $ref: "#/components/parameters/WorkspaceIdHeader"
      - $ref: "#/components/parameters/CorrelationIdHeader"
      - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DatasetCreate"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetRead"
          description: Successful response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - TenantContext: []
        WorkspaceContext: []
      summary: Create a dataset; tenant + workspace come from request headers.
      tags:
      - datasets
      x-content-type: application/json
      x-accepts:
      - application/json
  /api/v1/datasets/by-name/{name}:
    get:
      description: |-
        Reads the workspace scope from ``X-Workspace-Id``. Datasets enforce
        ``UNIQUE(workspace_id, name)`` so the lookup always returns 0 or 1.
      operationId: read_by_name
      parameters:
      - explode: false
        in: path
        name: name
        required: true
        schema:
          nullable: true
          type: string
        style: simple
      - $ref: "#/components/parameters/TenantIdHeader"
      - $ref: "#/components/parameters/WorkspaceIdHeader"
      - $ref: "#/components/parameters/CorrelationIdHeader"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetRead"
          description: Successful response
      security:
      - TenantContext: []
        WorkspaceContext: []
      summary: "Resolve a dataset by ``(tenant_id, workspace_id, name)``."
      tags:
      - datasets
      x-accepts:
      - application/json
  /api/v1/datasets/{dataset_id}:
    delete:
      operationId: archive
      parameters:
      - explode: false
        in: path
        name: dataset_id
        required: true
        schema:
          type: string
        style: simple
      - $ref: "#/components/parameters/TenantIdHeader"
      - $ref: "#/components/parameters/WorkspaceIdHeader"
      - $ref: "#/components/parameters/CorrelationIdHeader"
      - $ref: "#/components/parameters/IdempotencyKeyHeader"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetRead"
          description: Successful response
      security:
      - TenantContext: []
        WorkspaceContext: []
      summary: Archive a dataset (set status=ARCHIVED).
      tags:
      - datasets
      x-accepts:
      - application/json
    get:
      operationId: read
      parameters:
      - explode: false
        in: path
        name: dataset_id
        required: true
        schema:
          nullable: true
          type: string
        style: simple
      - $ref: "#/components/parameters/TenantIdHeader"
      - $ref: "#/components/parameters/WorkspaceIdHeader"
      - $ref: "#/components/parameters/CorrelationIdHeader"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetRead"
          description: Successful response
      security:
      - TenantContext: []
        WorkspaceContext: []
      summary: Fetch a single dataset by id. Returns 404 if not found.
      tags:
      - datasets
      x-accepts:
      - application/json
    put:
      operationId: update
      parameters:
      - explode: false
        in: path
        name: dataset_id
        required: true
        schema:
          type: string
        style: simple
      - $ref: "#/components/parameters/TenantIdHeader"
      - $ref: "#/components/parameters/WorkspaceIdHeader"
      - $ref: "#/components/parameters/CorrelationIdHeader"
      - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DatasetUpdate"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetRead"
          description: Successful response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - TenantContext: []
        WorkspaceContext: []
      summary: Sparse-update a dataset. Only fields present in body are changed.
      tags:
      - datasets
      x-content-type: application/json
      x-accepts:
      - application/json
  /api/v1/datasets/{dataset_id}/files:
    post:
      operationId: upload_file
      parameters:
      - explode: false
        in: path
        name: dataset_id
        required: true
        schema:
          type: string
        style: simple
      - $ref: "#/components/parameters/TenantIdHeader"
      - $ref: "#/components/parameters/WorkspaceIdHeader"
      - $ref: "#/components/parameters/CorrelationIdHeader"
      - $ref: "#/components/parameters/IdempotencyKeyHeader"
      responses:
        "201":
