        id: id
        scopes:
        - scopes
        - scopes
        created_by: created_by
        rate_limit_rpm: 0
      properties:
        created_at:
          format: date-time
          title: Created At
          type: string
        created_by:
          title: Created By
          type: string
        expires_at:
          format: date-time
          nullable: true
          type: string
        id:
          title: Id
          type: string
        last_used_at:
          format: date-time
