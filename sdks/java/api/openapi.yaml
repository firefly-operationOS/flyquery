  securitySchemes:
    AgentToken:
      description: Bearer token for the agent tier. Required on every ``/api/v1/agent/*``
        operation. Replaces tenant + workspace headers -- the token's claims carry
        both.
      in: header
      name: X-Agent-Token
      type: apiKey
    TenantContext:
      description: Non-agent operations require ``X-Tenant-Id`` + ``X-Workspace-Id``
        headers. Treated as an apiKey scheme so Swagger UI's `Authorize` dialog can
        prefill them across all requests.
      in: header
      name: X-Tenant-Id
      type: apiKey
    WorkspaceContext:
      description: Companion header to TenantContext (accepts UUID or slug).
      in: header
      name: X-Workspace-Id
      type: apiKey

